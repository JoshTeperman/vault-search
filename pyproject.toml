[project]
name = "vault-search"
version = "0.1.0"
description = "Agent-facing, read-only search interface and MCP server for a private knowledge vault."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Josh Teperman" }]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vault_search*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
